name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: act
          POSTGRES_PASSWORD: act_dev_password
          POSTGRES_DB: act_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U act -d act_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ACT_TEST_DATABASE_URL: postgresql+psycopg://act:act_dev_password@localhost:5432/act_test
      # Integration tests must run here: fail instead of skipping if the database is missing.
      ACT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=control_tower --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
