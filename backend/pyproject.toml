[project]
name = "control-tower"
version = "0.1.0"
description = "Agent Control Tower backend: policy gateway, audit trail and management API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx2>=2.10,<3",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
act = "control_tower.cli:main"
act-mcp = "control_tower.mcp_server:main"

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_tower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database (see docs/development-guide.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101", # asserts are the point of tests and of internal invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fixed test credentials
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["control_tower"]
plugins = ["pydantic.mypy"]
